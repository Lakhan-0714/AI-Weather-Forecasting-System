<!DOCTYPE html>
<html>
<head>
    <title>AI Weather Forecasting System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="landing-body">

    <div class="navbar">
        <div class="logo">☀️ AI Weather</div>
        <div class="nav-text">Real-Time Forecast Dashboard</div>
    </div>

    <section class="landing-hero">

        <div class="hero-content">

            <h1>Weather Forecasting<br>Made Smarter</h1>
            <p>Search any city, state or district and get live weather, forecast, humidity, wind, UV index and more.</p>

<form action="/predict" method="POST" class="main-search">

    <div class="search-wrapper">

        <input type="text"
               id="cityInput"
               name="city"
               placeholder="Search your city..."
               autocomplete="off"
               required>

        <div id="suggestions"></div>

    </div>

   <button type="submit">Search</button>

 <button type="button" id="voiceBtn">

    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Google_mic.svg"
         alt="Mic"
         class="mic-icon">

 </button>

</form>

            <div class="city-cards">
                <div class="city-card">Jaipur <span>India</span></div>
                <div class="city-card">Delhi <span>India</span></div>
                <div class="city-card">Mumbai <span>India</span></div>
            </div>

        </div>

    </section>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
